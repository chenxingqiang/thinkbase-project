name: "Academic Support Agent"
version: "1.0.0"

# API configuration
api:
  deepseek_key: "your_api_key_here"  # Optional: Set your DeepSeek API key here if not using environment variable

# Research context configuration
research_context:
  topic: "LaTeX Template Processing"
  current_status: "Development"
  specific_topics:
    - "LaTeX Template Management"
    - "PDF Generation"
    - "Document Processing"
  research_fields:
    - "Document Automation"
    - "Academic Publishing"
    - "Technical Documentation"

# Publication goals
publication_goals:
  target_journal: "Journal of Document Engineering"
  submission_timeline: "Q2 2024"
  target_audience:
    - "Academic researchers"
    - "Technical writers"
    - "Document engineers"

# Research methods
research_methods:
  - "Template Analysis"
  - "PDF Generation Testing"
  - "Error Analysis"
  - "Performance Optimization"

# Resources configuration
resources:
  time_investment: "3 months"
  computing_resources: "Local workstation"
  database_access: "Local file system"
  
# Output configuration
output:
  base_directory: "output/latex"
  formats:
    - "PDF"
    - "LaTeX"
  cleanup: true
  
# LaTeX configuration
latex:
  engines:
    - "pdflatex"
    - "xelatex"
    - "lualatex"
  compile_options:
    - "-interaction=nonstopmode"
    - "-output-directory=output/latex"
  max_runs: 3
  timeout_seconds: 300

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  output:
    file: "logs/processing.log"
    console: true 