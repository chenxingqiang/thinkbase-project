# Default Agent Configuration
name: default_agent
type: generic
version: 1.0.0
mode: sequential
description: Default agent configuration

model:
  provider: openai
  name: gpt-4
  temperature: 0.7
  max_tokens: 4096

workflow:
  id: default-workflow
  name: default_workflow
  max_iterations: 10
  timeout: 3600

execution:
  max_retries: 3
  retry_backoff: 2.0
  retry_delay: 0.1
  distributed: false

error_handling:
  retry_strategy: cascade
  max_retries: 3
  fallback_mechanism: true
